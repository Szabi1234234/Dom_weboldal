<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="memoria.css">
    <title>Motorhang memória</title>
</head>
<body>
    <script>
        // ====== ADATOK ======
        
        const ADATOK = [
    { nev: "VW Golf GTI",           kep: "images/golf_gti.jpg",   hang: "images/golf_gti.mp3",   motor: "images/golf_gti_motor.jpg" },
    { nev: "VW Passat 1.9 TDI",     kep: "images/passat_tdi.jpg", hang: "images/passat_tdi.mp3", motor: "images/passat_tdi_motor.jpg" },
    { nev: "Lada Niva",             kep: "images/lada_niva.jpg",  hang: "images/lada_niva.mp3",  motor: "images/lada_niva_motor.jpg" },
    { nev: "Mercedes W123 Diesel",  kep: "images/w123.jpg",       hang: "images/w123.mp3",       motor: "images/w123_motor.jpg" },
    { nev: "Ford Transit 2.5D",     kep: "images/transit.jpg",    hang: "images/transit.mp3",    motor: "images/transit_motor.jpg" },
    { nev: "Trabant 601",           kep: "images/trabant.jpg",    hang: "images/trabant.mp3",    motor: "images/trabant_motor.jpg" },
    { nev: "Fiat Panda 750",        kep: "images/panda.jpg",      hang: "images/panda.mp3",      motor: "images/panda_motor.jpg" },
    { nev: "Dodge Ram 5.9 Cummins", kep: "images/dodge_ram.jpg",  hang: "images/dodge_ram.mp3",  motor: "images/dodge_ram_motor.jpg" }
];
        const OSZLOP = 4;

        // ====== ÁLLAPOT ======
        let nehez = false;     
        let kartyak = [];      
        let elso = null;       
        let masodik = null;    
        let zarolva = false;   
        let talalatok = 0;
        let lepesek = 0;
        let jatekSzam = 0;     

        
        const hangok = [];
        for (let i = 0; i < ADATOK.length; i++) {
            const hang = new Audio(ADATOK[i].hang);
            hang.preload = "auto";
            hangok.push(hang);
        }
        let jelenlegiHang = null; 

        // ====== OLDAL FELÉPÍTÉSE ======
        const cim = document.createElement("h1");
        cim.textContent = "Motorhang memória";
        document.body.appendChild(cim);

        const leirasSor = document.createElement("p");
        leirasSor.textContent = "Párosítsd az autót a motorhanggal!";
        document.body.appendChild(leirasSor);

        
        const modSor = document.createElement("div");
        modSor.id = "modok";
        document.body.appendChild(modSor);

        const konnyuGomb = document.createElement("button");
        konnyuGomb.textContent = "Könnyű mód";
        konnyuGomb.setAttribute("onclick", "modValtas(false)");
        modSor.appendChild(konnyuGomb);

        const nehezGomb = document.createElement("button");
        nehezGomb.textContent = "Nehéz mód";
        nehezGomb.setAttribute("onclick", "modValtas(true)");
        modSor.appendChild(nehezGomb);

        const szamlalo = document.createElement("p");
        szamlalo.id = "szamlalo";
        document.body.appendChild(szamlalo);

        const alap = document.createElement("div");
        alap.id = "alap";
        alap.style.gridTemplateColumns = "repeat(" + OSZLOP + ", 130px)";
        document.body.appendChild(alap);

        const ujra = document.createElement("button");
        ujra.id = "ujra";
        ujra.textContent = "Újrakezdés";
        ujra.setAttribute("onclick", "ujJatek()");
        document.body.appendChild(ujra);

        // ====== FÜGGVÉNYEK ======
        function keveres(tomb) {
            for (let i = tomb.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = tomb[i];
                tomb[i] = tomb[j];
                tomb[j] = temp;
            }
        }

        function hangLeallitas() {
            if (jelenlegiHang !== null) {
                jelenlegiHang.pause();
                jelenlegiHang.currentTime = 0;
                jelenlegiHang = null;
            }
        }

        function hangLejatszas(par) {
            const hang = hangok[par];

            
            if (jelenlegiHang === hang && !hang.paused && !hang.ended) {
                return;
            }

            
            hangLeallitas();
            jelenlegiHang = hang;
            hang.currentTime = 0;
            
            hang.play().catch(() => {});
        }

        function modValtas(ujNehez) {
            nehez = ujNehez;
            ujJatek();
        }

        function ujJatek() {
            jatekSzam++;
            hangLeallitas();

            
            kartyak = [];
            elso = null;
            masodik = null;
            zarolva = false;
            talalatok = 0;
            lepesek = 0;
            szamlalo.textContent = "Lépések: 0";
            alap.innerHTML = "";

            
            konnyuGomb.className = nehez ? "" : "aktiv";
            nehezGomb.className = nehez ? "aktiv" : "";

            
            for (let i = 0; i < ADATOK.length; i++) {
                kartyak.push({ par: i, tipus: "auto" });
                kartyak.push({ par: i, tipus: "hang" });
            }
            keveres(kartyak);

            
            for (let i = 0; i < kartyak.length; i++) {
                const adat = ADATOK[kartyak[i].par];

                const cella = document.createElement("div");
                cella.className = "kartya";
                cella.id = "k" + i;
                cella.setAttribute("onclick", "lepes(this)");

                const tartalom = document.createElement("div");
                tartalom.className = "tartalom";

                if (kartyak[i].tipus === "auto") {
                    const kep = document.createElement("img");
                    kep.src = adat.kep;
                    kep.alt = adat.nev;
                    
                    kep.onerror = function () {
                        kep.remove();
                    };
                    tartalom.appendChild(kep);

                    const felirat = document.createElement("div");
                    felirat.className = "felirat";
                    felirat.textContent = adat.nev;
                    tartalom.appendChild(felirat);
                } else {
                  
                    tartalom.classList.add("hang");

                    const motorKep = document.createElement("img");
                    motorKep.src = adat.motor;
                    motorKep.alt = "Motor";
                    motorKep.onerror = function () {
                        motorKep.remove();
                        const ikon = document.createElement("div");
                        ikon.className = "hang-ikon";
                        ikon.textContent = "🔊";
                        tartalom.appendChild(ikon);
                    };
                    tartalom.appendChild(motorKep);
}

                cella.appendChild(tartalom);
                alap.appendChild(cella);
            }
        }

        function lepes(melyik) {
            if (zarolva) return;
            if (melyik.classList.contains("fent")) return;   

            const index = parseInt(melyik.id.substring(1));
            melyik.classList.add("fent");

            
            if (!(nehez && kartyak[index].tipus === "auto")) {
                hangLejatszas(kartyak[index].par);
            }

            if (elso === null) {
                elso = melyik;
                return;
            }

            masodik = melyik;
            lepesek++;
            szamlalo.textContent = "Lépések: " + lepesek;

            const index1 = parseInt(elso.id.substring(1));
            const index2 = parseInt(masodik.id.substring(1));

            if (kartyak[index1].par === kartyak[index2].par) {
                
                hangLejatszas(kartyak[index2].par);
                elso.classList.add("talalt");
                masodik.classList.add("talalt");
                elso = null;
                masodik = null;
                talalatok++;

                if (talalatok === ADATOK.length) {
                    setTimeout(() => {
                        window.alert("Nyertél! Lépések: " + lepesek);
                    }, 300);
                }
            } else {
                
                zarolva = true;
                const aktualis = jatekSzam;
                setTimeout(() => {
                    if (aktualis !== jatekSzam) return;   
                    elso.classList.remove("fent");
                    masodik.classList.remove("fent");
                    elso = null;
                    masodik = null;
                    zarolva = false;
                }, 1200);
            }
        }

        
        ujJatek();
    </script>
</body>
</html>
