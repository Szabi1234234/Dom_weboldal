<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="memoria.css">
    <title>Memóriajáték</title>
</head>
<body>
    <script>
        // ====== BEÁLLÍTÁSOK ======
        // IDE írd be a képeid elérési útját (8 db kell, mindegyikből 2 kártya lesz).
        // Tedd a képeket a "kepek" mappába. Amíg nincs meg a kép, "KÉP 1", "KÉP 2"... felirat látszik.
        const KEPEK = [
            "kepek/1.jpg",
            "kepek/2.jpg",
            "kepek/3.jpg",
            "kepek/4.jpg",
            "kepek/5.jpg",
            "kepek/6.jpg",
            "kepek/7.jpg",
            "kepek/8.jpg"
        ];

        const OSZLOP = 4;
        const SOR = (KEPEK.length * 2) / OSZLOP;

        // ====== ÁLLAPOT ======
        let kartyak = [];      // a kártyák "tartalma" (képek sorszáma, összekeverve)
        let elso = null;       // az első felfordított kártya (div)
        let masodik = null;    // a második felfordított kártya (div)
        let zarolva = false;   // amíg két kártya látszik, nem lehet kattintani
        let talalatok = 0;
        let lepesek = 0;

        // ====== OLDAL FELÉPÍTÉSE ======
        const cim = document.createElement("h1");
        cim.textContent = "Memóriajáték";
        document.body.appendChild(cim);

        const szamlalo = document.createElement("p");
        szamlalo.id = "szamlalo";
        szamlalo.textContent = "Lépések: 0";
        document.body.appendChild(szamlalo);

        const alap = document.createElement("div");
        alap.id = "alap";
        alap.style.gridTemplateColumns = "repeat(" + OSZLOP + ", 100px)";
        document.body.appendChild(alap);

        const ujra = document.createElement("button");
        ujra.id = "ujra";
        ujra.textContent = "Újrakezdés";
        ujra.setAttribute("onclick", "window.location.reload()");
        document.body.appendChild(ujra);

        // kártyák listája: minden sorszám kétszer, majd keverés
        for (let i = 0; i < KEPEK.length; i++) {
            kartyak.push(i);
            kartyak.push(i);
        }
        keveres(kartyak);

        // kártyák legyártása ciklussal
        for (let i = 0; i < kartyak.length; i++) {
            const cella = document.createElement("div");
            cella.className = "kartya";
            cella.id = "k" + i;
            cella.setAttribute("onclick", "lepes(this)");

            const kep = document.createElement("img");
            kep.src = KEPEK[kartyak[i]];
            kep.alt = "KÉP " + (kartyak[i] + 1);
            // ha nincs meg a kép, szöveg jelenik meg helyette
            kep.onerror = function () {
                kep.remove();
                tartalom.textContent = "KÉP " + (kartyak[i] + 1);
            };

            const tartalom = document.createElement("div");
            tartalom.className = "tartalom";
            tartalom.appendChild(kep);

            cella.appendChild(tartalom);
            alap.appendChild(cella);
        }

        // ====== FÜGGVÉNYEK ======
        function keveres(tomb) {
            for (let i = tomb.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = tomb[i];
                tomb[i] = tomb[j];
                tomb[j] = temp;
            }
        }

        function lepes(melyik) {
            if (zarolva) return;
            if (melyik.classList.contains("fent")) return;   // már fel van fordítva / megtalált

            melyik.classList.add("fent");

            if (elso === null) {
                elso = melyik;
                return;
            }

            masodik = melyik;
            lepesek++;
            szamlalo.textContent = "Lépések: " + lepesek;

            const index1 = parseInt(elso.id.substring(1));
            const index2 = parseInt(masodik.id.substring(1));

            if (kartyak[index1] === kartyak[index2]) {
                // találat
                elso.classList.add("talalt");
                masodik.classList.add("talalt");
                elso = null;
                masodik = null;
                talalatok++;

                if (talalatok === KEPEK.length) {
                    setTimeout(() => {
                        window.alert("Nyertél! Lépések: " + lepesek);
                    }, 300);
                }
            } else {
                // nem egyezik: rövid várakozás, aztán visszafordul
                zarolva = true;
                setTimeout(() => {
                    elso.classList.remove("fent");
                    masodik.classList.remove("fent");
                    elso = null;
                    masodik = null;
                    zarolva = false;
                }, 800);
            }
        }
    </script>
</body>
</html>
